# Library API: the app and PostgreSQL 17 for local runs and CI.
#   docker compose up --build
#   TEST_MODE=1 docker compose up --build      (to run the conformance suite)
# The database port is not published, so it never clashes with a PostgreSQL
# already running on the machine. Uncomment "ports" under db to reach it.
# The credentials are for local development only.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    # ports:
    #   - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://library:library@db:5432/library
      TEST_MODE: ${TEST_MODE:-0}
      LIBRARY_TODAY: ${LIBRARY_TODAY:-}
      TZ: Europe/London
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
